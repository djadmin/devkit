name: Mac App

on:
  push:
    branches: [main]
    paths:
      - 'MenuBarApp/**'
      - '.github/workflows/mac-app.yml'
  pull_request:
    paths:
      - 'MenuBarApp/**'

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: MenuBarApp
        run: xcodegen generate

      - name: Build
        working-directory: MenuBarApp
        run: |
          set -o pipefail
          xcodebuild \
            -scheme DevkitBar \
            -configuration Debug \
            -project DevkitBar.xcodeproj \
            build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | grep -E "error:|BUILD SUCCEEDED|BUILD FAILED"

      - name: Test
        working-directory: MenuBarApp
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme DevkitBarTests \
            -project DevkitBar.xcodeproj \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | grep -E "Test Suite|passed|failed|error:"
